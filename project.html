<!DOCTYPE html>
<html>
<head>

<title>Practice Work</title>

<style>

body{
font-family: Arial;
background:#fbffca;
margin:0;
padding:0;
}

 header{
background:#222;
color:white;
text-align:center;
padding:25px;
font-size:30px;
letter-spacing:2px;

 }

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:40px;
gap:80px;
}

.card{
width:260px;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-content{
padding:15px;
text-align:center;
}

.card-content h3{
margin:10px 0;
}

.card-content p{
font-size:14px;
color:#555;
}

.btn{
display:inline-block;
margin-top:10px;
padding:8px 18px;
background:#222;
color:white;
text-decoration:none;
border-radius:5px;
}

.btn:hover{
background:#444;
}
.main-header{
    background:black;
    color:white;
    padding:20px;
    text-align:center;
}
span{
    display:block;
}

.box{
    padding:20px;
    margin:10px;
    border-radius:10px;
}


@media (max-width:768px){
body{
    margin: 0;
    overflow-x: hidden;
}
    header{
        font-size:24px;
        padding:18px;
        letter-spacing:1px;
    }

    .container{
        flex-direction:column;
        align-items:center;
        padding:30px;
        gap:20px;
    }

    .card{
        width:90%;
        max-width:350px;
    }

    .card img{
        height:200px;
    }

    .card-content h3{
        font-size:20px;
    }

    .card-content p{
        font-size:15px;
    }

    .btn{
        padding:10px 20px;
        font-size:15px;
    }

    .main-header{
        padding:15px;
        font-size:22px;
    }

    .same-header{
        width :100%;
        font-size:22px;
        padding:18px;
        box-sizing:border-box;
    }

    .box{
        width: 100%;
        margin:20px 0;
        padding:0;
    }

}



</style>
</head>
