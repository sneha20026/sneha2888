<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <style>

 body
{
     background-color: #fbffca;
}


  </style>
  <body>
    <div class="container-fluid">
        <h1 class="bg-warning text-center mt-3 rounded-3 p-1 fs-2 shadow-sm" style="font-family:Arial, Helvetica, sans-serif;">CAROUSEL SLIDDER</h1>
<div id="carouselExampleIndicators" class="carousel slide mt-5">
  <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
    
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
     <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
  </div>
  
  <div class="carousel-inner">
    <div class="carousel-item active" data-bs-interval="4000">
      <img src="https://i.pinimg.com/736x/c4/d8/fb/c4d8fb0f48743e3b2ba7a16b55a9c9d3.jpg" class="d-block w-50 mx-auto rounded-3 " alt="...">
    </div>
    <div class="carousel-item" data-bs-interval="5000">
      <img src="https://i.pinimg.com/736x/6a/1d/f8/6a1df830d8e9e5fe60b9195988c70761.jpg" class="d-block w-50 mx-auto rounded-3" alt="...">
    </div>
    <div class="carousel-item" data-bs-interval="5000">
      <img src="https://i.pinimg.com/1200x/bb/43/20/bb4320813bf810f135a0f25cbbbd0023.jpg" class="d-block w-50 mx-auto rounded-3" alt="...">
    </div>

     <div class="carousel-item" data-bs-interval="5000">
      <img src="https://i.pinimg.com/736x/00/64/23/0064233ab92974ff794d7439d8865f2b.jpg" class="d-block w-50 mx-auto rounded-3" alt="...">
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
    
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
    
  </button>

  </div>
  </div>
  </div>
</div>
</div>
 
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
