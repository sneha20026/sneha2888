<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creative Tooltip</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            
            background:#fbffca;
            font-family: Arial, sans-serif;
            text-align: center;
            padding:  20px;
        }

        .skill-box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            margin-top: 40px;
        }

        .skill-btn {
            margin: 10px;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: bold;
        }

        .heading {
            margin-bottom: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>
  <h1 class="bg-info-subtle rounded-2">TOOLTIPS</h1>

    <div class="skill-box">

      

        <!-- HTML -->
        <button class="btn btn-danger skill-btn"
                data-bs-toggle="tooltip"
                data-bs-placement="top"
                title="HTML creates the structure of a webpage.">
            🌐 HTML
        </button>

        <!-- CSS -->
        <button class="btn btn-primary skill-btn"
                data-bs-toggle="tooltip"
                data-bs-placement="bottom"
                title="CSS makes websites beautiful and stylish.">
            🎨 CSS
        </button>

        <!-- JavaScript -->
        <button class="btn btn-warning skill-btn"
                data-bs-toggle="tooltip"
                data-bs-placement="right"
                title="JavaScript adds interaction and dynamic effects.">
            ⚡ JavaScript
        </button>

        <!-- Bootstrap -->
        <button class="btn btn-success skill-btn"
                data-bs-toggle="tooltip"
                data-bs-placement="left"
                title="Bootstrap helps create responsive websites quickly.">
            🅱️ Bootstrap
        </button>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const tooltipList =
            document.querySelectorAll('[data-bs-toggle="tooltip"]');

        [...tooltipList].forEach(function (tooltip) {
            new bootstrap.Tooltip(tooltip);
        });
    </script>

</body>
</html>
