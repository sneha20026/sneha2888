<!doctype html>

<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PROGRESS BAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

    <h1 class="bg-info text-center p-2 rounded-top fs-3">PROGRESS BAR</h1>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
             background:#fbffca;
            font-family: Arial, sans-serif;
            padding: 20px
        }

        .progress-card {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            margin-top: 30px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-weight:600;
            font-size:30px;
            text-decoration: underline;
        }

        .course {
            margin-bottom: 25px;
        }

        .course-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .progress {
            height: 20px;
            border-radius: 20px;
            background: #e9ecef;
        }

        .progress-bar {
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-box {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="progress-card">

        <h2 class="title">COUNTRY POPULATIONS</h2>

        <!-- HTML -->
        <div class="course">

            <div class="course-name">
                <span>🌐 INDIA</span>
                <span>1.476 billion</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-success text-dark"
                     style="width: 95%;">
                    95%
                </div>
            </div>

        </div>


        <!-- CSS -->
        <div class="course">

            <div class="course-name">
                <span>🈶CHINA</span>
                <span>1.412 billion</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-info text-dark"
                     style="width: 83%;">
                    83%
                </div>
            </div>

        </div>



        <!-- Bootstrap -->
        <div class="course">

            <div class="course-name">
                <span>♈UNITED STATES</span>
                <span>349 million</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-primary text-dark"
                     style="width: 60%;">
                    60%
                </div>
            </div>

        </div>

        <!-- JavaScript -->
        <div class="course">

            <div class="course-name">
                <span>✴RUSSIA</span>
                <span>142 million</span>
            </div>

            <div class="progress">
                <div class="progress-bar bg-warning text-dark Bold text."
                     style="width: 40%;">
                  40%
                </div>
            </div>

        </div>



        <div class="badge-box">
            <span class="badge text-bg-dark p-2">
                🌏 Global Demographics
            </span>
        </div>

    </div>

</body>
</html>
    





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
