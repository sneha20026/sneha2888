<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creative Bootstrap Breadcrumb</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
  body{
background:#fbffca;

}
</style>


    <div class="container mt-3">

        <!-- Heading -->
       <h1 class = "bg-danger-subtle text-center fs-2 rounded-3">BREADCRUMB</h1>


        <!-- Creative Breadcrumb Card -->
        <div class="card border-0 shadow-lg rounded-4 p-3 mt-5">

            <nav aria-label="breadcrumb">

                <ol class="breadcrumb mb-0 justify-content-center 
                           bg-primary bg-opacity-10 
                           rounded-pill px-4 py-3">

                    <li class="breadcrumb-item">
                        <a href="index.html" 
                           class="text-decoration-none fw-bold text-primary">
                            🏠 Home
                        </a>
                    </li>

                    <li class="breadcrumb-item">
                        <a href="practice.html" 
                           class="text-decoration-none fw-bold text-primary">
                            💻 Practice
                        </a>
                    </li>

                    <li class="breadcrumb-item">
                        <a href="project.html" 
                           class="text-decoration-none fw-bold text-primary">
                            🎨 Projects
                        </a>
                    </li>

                    <li class="breadcrumb-item active fw-bold text-dark"
                        aria-current="page">
                        ✨ Current Page
                    </li>

                </ol>

            </nav>

        </div>


      
            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
