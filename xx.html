<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collapse</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
       
 body
{
     background-color: #fbffca;
}


        .title {
            text-align: center;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .collapse-box {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .option {
            width: 30%;
            min-width: 250px;
            border-radius: 18px;
            overflow: hidden;
            background: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            transition: 0.3s;
            margin-top: 50px;
        }

        .option:hover {
            transform: translateY(-8px);
        }

        .option-btn {
            width: 100%;
            border: none;
            padding: 22px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #6c63ff;
           
        }

        .option:nth-child(2) .option-btn {
            background: #ff6584;
        }

        .option:nth-child(3) .option-btn {
            background: #20b486;
        }

        .content img {
            width: 400px;
            padding:15px;
            
        }
.contentee img{
     height:300px;
     padding: 18px;
     width: 450px;
}

.contenteee img{
     height:300px;
     padding: 10px;
     width: 300px;
}

    </style>
</head>

<body>

 <h1 class="bg-warning text-center rounded-3 mt-2">COLLAPSE</h1>

    <div class="collapse-box text-center">

        <!-- Option 1 -->
        <div class="option">

            <button class="option-btn"
                    data-bs-toggle="collapse"
                    data-bs-target="#web">
                
                🏝NATURE IMAGE
            </button>

            <div id="web " class="collapse show ">
                <div class="content">
            
                   <img src ="https://i.pinimg.com/1200x/54/2c/6a/542c6ace9988a9c1b45c5342c9e50e86.jpg" class="img-fluid rounded-3">
                </div>
            </div>

        </div>


        <!-- Option 2 -->
        <div class="option">

            <button class="option-btn"
                    data-bs-toggle="collapse"
                    data-bs-target="#graphic">
                ⛰MOUNTAIN IMAGE
            </button>

            <div id="graphic" class="collapse">
                <div class="contentee">
                    <img src ="https://i.pinimg.com/736x/1f/e6/2c/1fe62c5f107d6193a7003e1438984bdd.jpg">
                </div>
            </div>

        </div>


        <!-- Option 3 -->
        <div class="option">

            <button class="option-btn"
                    data-bs-toggle="collapse"
                    data-bs-target="#animation">
                🦜BIRDS IMAGE
            </button>

            <div id="animation" class="collapse">
                <div class="contenteee">
                   <img src ="https://i.pinimg.com/736x/71/c3/2d/71c32ddf090c50bfb8d30373f98daea7.jpg">
                </div>
            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
